spring:
  application:
    name: accountant
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Mexico_City
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Mexico_City

server:
  port: 8080
  servlet:
    context-path: /accountant
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  time-zone: America/Mexico_City
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}
  cors:
    allowed-origins: []
