# Development profile — default values ONLY for local development.
# Never put real passwords here; override them with environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accountant_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    # 256-bit development-only secret (base64). Override with JWT_SECRET.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1hY2NvdW50YW50LWp3dC0yNTZiaXRz}
  cors:
    allowed-origins:
      - http://localhost:4200

logging:
  level:
    com.devs.accountant: DEBUG
