# Local "production": NGINX (Angular + reverse proxy) and Spring Boot (profile prod).
# PostgreSQL runs on the host machine, outside Docker. Configuration in .env (see .env.example).
name: accountant

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    image: accountant-backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/accountant}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-240}
    # Lets the container reach the host's PostgreSQL on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No ports on the host: only NGINX talks to it.
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: accountant-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8085}:80"
